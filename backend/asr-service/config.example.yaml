# Copy to config.yaml and adjust for your experiments.
# Change only "provider" to switch engines (whisper | mock).
asr:
  provider: mock
  model: base
  device: cpu
  language: es
  compute_type: int8
  # Word list passed to fast-whisper as initial_prompt (comma-separated)
  prompt:
    - hipertensión
    - diabetes
    - Enalapril
    - Metformina

pln_medical:
  task: ner
  model: rigonsallauka/spanish_medical_ner
  aggregation_strategy: max

pln_farmacos:
  task: token-classification
  model: PlanTL-GOB-ES/bsc-bio-ehr-es-pharmaconer
  aggregation_strategy: simple

snomed:
  enabled: true

# Per-session text reports (one file per X-Session-Id)
reports:
  enabled: true
  dir: reports
