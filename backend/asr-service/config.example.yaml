# Copy to config.yaml and adjust for your experiments.
# Change only "provider" to switch engines (whisper | mock).
asr:
  provider: mock
  model: base
  device: cpu
  language: es
  compute_type: int8
  # Word list passed to fast-whisper as initial_prompt (comma-separated)
  prompt:
    - hipertensión
    - diabetes
    - Enalapril
    - Metformina

pln_medical:
  task: ner
  model: rigonsallauka/spanish_medical_ner
  aggregation_strategy: max

pln_farmacos:
  task: token-classification
  model: PlanTL-GOB-ES/bsc-bio-ehr-es-pharmaconer
  aggregation_strategy: simple

snomed:
  enabled: true

# Per-session text reports (one file per X-Session-Id)
reports:
  enabled: true
  dir: reports

# LLM (Ollama) for generating the final medical report from the session report
llm:
  enabled: true
  model: llama3.1:8b
  base_url: http://localhost:11434
  timeout_seconds: 120
  system_prompt: |
    Eres un asistente médico especializado en documentación clínica.
    A continuación recibirás el reporte de una consulta médica generado automáticamente
    a partir de la transcripción de audio, las entidades clínicas detectadas (NER) y sus
    conceptos SNOMED CT asociados.

    Tu tarea es redactar un informe médico estructurado, claro y profesional en español,
    dirigido a ser incluido en la historia clínica del paciente.

    El informe debe incluir:
    - Motivo de consulta (basado en los síntomas y problemas detectados)
    - Antecedentes relevantes mencionados
    - Hallazgos clínicos (entidades detectadas con sus conceptos SNOMED cuando estén disponibles)
    - Impresión diagnóstica provisional (si los datos lo permiten)
    - Recomendaciones o próximos pasos sugeridos

    Sé conciso, usa terminología médica apropiada y mantén un tono formal y objetivo.
    No inventes datos que no estén presentes en el reporte.

# FHIR R4 Bundle report (stub) from the session report, independent of the LLM output
fhir_report:
  enabled: true

# Traducción SNOMED CT → ICD-10 via cadena de fallback (FHIR)
# Paso 1: ConceptMap $translate con mapa primario   (6011000124106)
# Paso 2: ConceptMap $translate con mapa de reserva (447562003)
# Paso 3: ValueSet $expand con el término de la entidad como filtro
fhir_concept_map:
  enabled: true
  base_url: http://localhost:8080/fhir
  concept_map_url: "http://snomed.info/sct?fhir_cm=6011000124106"
  concept_map_fallback_url: "http://snomed.info/sct?fhir_cm=447562003"
  value_set_expand_url: "http://snomed.info/sct/449081005?fhir_vs"
  language: es
  timeout_seconds: 10
